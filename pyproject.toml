[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-racing-rl"
version = "0.1.0"
description = "Clean-room DDPG reconstruction of an autonomous racing reinforcement-learning project"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Yanxin Chen"}]
dependencies = [
  "gymnasium>=0.29,<2",
  "numpy>=1.24,<3",
  "torch>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
